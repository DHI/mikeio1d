[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build_script.py"

[tool.hatch.scripts]
post-install = "scripts/install_dependencies.py" # for editable installs

[tool.hatch.build.targets.sdist]
exclude = ["notebooks", "tests", "images", "util"]

[tool.hatch.build.targets.sdist.force-include]
"src/mikeio1d/bin" = "src/mikeio1d/bin"

[tool.hatch.build.targets.wheel]
packages = ["src/mikeio1d"]

[project]
name = "mikeio1d"
version = "1.3.1"
description = "A package that uses the DHI MIKE1D .NET libraries to read res1d and xns11 files."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Gediminas Kirsanskas", email = "geki@dhigroup.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pythonnet>=3.0.0",
    "numpy",
    "pandas>=2.1.0",
    "matplotlib",
    'mikecore; platform_system=="Linux"',
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "matplotlib",
    "pyarrow",
    "nbformat",
    "nbconvert",
    "ipykernel",
]
all = ["matplotlib", "geopandas"]
dev = [
    "hatchling",
    "pytest",
    "pytest-cov",
    "ruff",
    "matplotlib",
    "jupyterlab",
    "geopandas",
    "folium",
    "mapclassify",
]
notebooks = [
    "matplotlib",
    "ipykernel",
    "nbformat",
    "nbconvert",
    "geopandas",
    "folium",
    "mapclassify",
]
docs = ["quarto-cli", "quartodoc==0.9.1", "griffe==1.5.1"]
experimental = ["xarray", "networkx", "typing-extensions>=4.10"]

[project.urls]
"Homepage" = "https://github.com/DHI/mikeio1d"
"Bug Tracker" = "https://github.com/DHI/mikeio1d/issues"

[tool.ruff]
# Pinned: ruff 0.16 grew its default rule set substantially, so an unpinned
# upgrade silently changes what CI enforces. Bump this and the version in
# .github/workflows/full_test.yml together.
required-version = ">=0.16,<0.17"
include = ["pyproject.toml", "src/mikeio1d/**/*.py"]
line-length = 100
lint.extend-select = ["D", "PD", "NPY", "FA"]
lint.ignore = [
    "E402",   # ignore for now
    "F401",   # ignore for now
    "I",      # the import grouping documented below is kept by hand, not by isort
    "TRY004", # ValueError -> TypeError on type checks would break callers
    "BLE001", # the broad catches wrap .NET interop, where the type is unknowable
    "S102",   # exec is how mikenet binds .NET namespaces into the module
    "DTZ001", # MIKE result timestamps are naive by design
]
lint.pydocstyle.convention = "numpy"

# Import convention, enforced by review rather than by isort: one name per line,
# Python imports first, then the DHI and System interop in a trailing group of
# their own. Ruff 0.16 turns I001 on by default and sorts alphabetically within
# each group, which loses the ordering the modules are actually read in, so the
# rule is ignored above.
